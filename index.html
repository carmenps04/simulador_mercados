<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mercado Móvil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Arabic:wght@400;700;800&display=swap">
<style>
/* Hoja de especificaciones de fábrica: clasificación arriba, resultados de la semana, decisiones con panel de mercado al lado */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#141B2B; --muted:#5A6478; --line:#D5DBE5;
  --accent:#2448B5; --accent-soft:#E3E9FA; --on-accent:#FFFFFF;
  --event:#9A520A; --event-soft:#FCEEDB;
  --good:#1E7A4C; --good-soft:#E1F3E9; --bad:#B3261E; --bad-soft:#FBE4E2;
  --c1:#2448B5; --c2:#C2410C; --c3:#15803D; --c4:#9333EA; --c5:#0E7490; --c6:#A16207; --c7:#DB2777; --c8:#475569;
  --f-display:"Bricolage Grotesque", "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141E; --surface:#182030; --ink:#E8ECF3; --muted:#9AA5BA; --line:#2A3447;
  --accent:#7D9BFF; --accent-soft:#1F2A4A; --on-accent:#0F141E;
  --event:#F0A24A; --event-soft:#3A2A15;
  --good:#4CC08A; --good-soft:#163526; --bad:#FF7A70; --bad-soft:#3E1C1A;
  --c1:#7D9BFF; --c2:#FB923C; --c3:#4ADE80; --c4:#C084FC; --c5:#22D3EE; --c6:#FACC15; --c7:#F472B6; --c8:#CBD5E1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141E; --surface:#182030; --ink:#E8ECF3; --muted:#9AA5BA; --line:#2A3447;
  --accent:#7D9BFF; --accent-soft:#1F2A4A; --on-accent:#0F141E;
  --event:#F0A24A; --event-soft:#3A2A15;
  --good:#4CC08A; --good-soft:#163526; --bad:#FF7A70; --bad-soft:#3E1C1A;
  --c1:#7D9BFF; --c2:#FB923C; --c3:#4ADE80; --c4:#C084FC; --c5:#22D3EE; --c6:#FACC15; --c7:#F472B6; --c8:#CBD5E1; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:.85rem;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Cabecera */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:4px 16px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
.brand .team{color:var(--muted);font-weight:700}
.kpis{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.kpi{display:flex;flex-direction:column}
.kpi b{font-family:var(--f-data);font-size:1.15rem;font-variant-numeric:tabular-nums}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.9rem}
.ghost:hover{border-color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* Clasificación */
.board{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
.toggle{display:inline-flex;background:var(--bg);border-radius:99px;padding:3px}
.toggle button{border:0;background:none;padding:6px 14px;border-radius:99px;font-weight:700;font-size:.9rem;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block;min-width:420px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:28px 12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank li.me{background:var(--accent-soft);border-radius:8px}
.rank .pos-n{font-family:var(--f-data);font-weight:600;color:var(--muted)}
.rank .sw{width:12px;height:12px;border-radius:3px}
.rank .nm{min-width:0}
.rank .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm span{font-size:.8rem;color:var(--muted)}
.rank .val{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.lead{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--good)}
.empty{padding:24px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}

/* Resultados */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--f-data);font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{font-size:.82rem;color:var(--muted)}
.stat.key{background:var(--accent-soft)}
.msgs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.msgs li{padding:10px 12px;border-radius:8px;background:var(--bg);border-left:4px solid var(--muted)}
.msgs li.good{border-left-color:var(--good);background:var(--good-soft)}
.msgs li.bad{border-left-color:var(--bad);background:var(--bad-soft)}

/* Decisiones */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:16px}
@media (max-width:960px){.side{position:static}}
.steps{display:flex;flex-direction:column;gap:16px}
.step-head{display:flex;gap:12px;align-items:baseline}
.step-n{font-family:var(--f-data);font-weight:600;color:var(--accent);font-size:.95rem}
.opts{display:grid;gap:10px}
.opts.models{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opts.conts{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{text-align:left;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt:hover{border-color:var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .t{font-weight:700;font-size:1.05rem}
.opt .s{font-size:.88rem;color:var(--muted)}
.opt .meta{font-family:var(--f-data);font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.comp{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;padding-block:6px;border-top:1px solid var(--line)}
.comp:first-of-type{border-top:0}
@media (max-width:520px){.comp{grid-template-columns:minmax(0,1fr)}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{background:var(--bg);border:2px solid transparent;border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg small{font-family:var(--f-data);font-size:.78rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.field output{font-family:var(--f-data);font-weight:600;font-size:1.1rem}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.event{background:var(--event-soft);border-color:var(--event)}
.event .label{color:var(--event)}
.trend-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.trend-list li{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.trend-list li.me{font-weight:700;color:var(--accent)}
.rows{display:flex;flex-direction:column;gap:4px}
.r{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.r b{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-weight:600}
.r.total{border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.meter{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.go{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:14px 18px;font-weight:700;font-size:1.05rem;width:100%}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.small{width:auto;padding:10px 16px;font-size:.95rem}
.warn{font-size:.88rem;color:var(--bad);font-weight:700}
.sent{background:var(--good-soft);color:var(--good);border-radius:8px;padding:10px 12px;font-weight:700;font-size:.92rem}
.phone-box{display:flex;gap:14px;align-items:center}
.phone{flex:none;border:3px solid var(--ink);border-radius:12px;background:var(--accent-soft);position:relative}
.phone::after{content:"";position:absolute;top:5px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}

/* Inicio y profesor */
.setup{max-width:640px;margin:4vh auto 0;display:flex;flex-direction:column;gap:20px;width:100%}
.setup h1{font-size:2.6rem;font-weight:800}
.form{display:grid;gap:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.form input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.err{color:var(--bad);font-weight:700;font-size:.92rem}
.teams-list{display:flex;flex-wrap:wrap;gap:8px}
.rules ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.foot{font-size:.8rem;color:var(--muted);text-align:center}
.top{padding-block:2px 8px}
.brand h1{font-size:1.45rem}
.kpi b{font-size:1rem}
.app{display:flex;flex-direction:column;gap:10px;min-height:0}
.main{display:flex;flex-direction:column;min-height:0}
.work{display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,24vw,290px);gap:14px;min-height:0}
.tabpanel{display:flex;flex-direction:column;gap:12px;min-height:0;padding:16px}
.tabbody{gap:12px}
.tabbody h2{font-size:1.2rem}
.tabs button{padding:8px 9px;font-size:.88rem;white-space:nowrap;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.grid2 .opt,.grid3 .opt,.grid4 .opt,.grid5 .opt{padding:10px 12px;gap:5px}
.grid4 .opt .s,.grid5 .opt .s{font-size:.82rem;line-height:1.35}
.grid4 .chip,.grid5 .chip{font-size:.72rem;padding:1px 7px}
.grid4 .opt .meta{font-size:.74rem}
.grid4 .opt{gap:4px;padding:9px 11px}
.r b{white-space:nowrap}
.toggle{align-self:flex-start}
.chart svg{max-height:52vh}
.coderow{display:flex;gap:8px}
.coderow input{flex:1;min-width:0}
.homecols .small-drop{width:80px;height:80px}
.homecols .note{font-size:.82rem;padding:8px 10px}
.setup.wide .hero h1{font-size:1.6rem}
.setup.wide .logo-big{height:56px}
.homecols .opts.models{grid-template-columns:repeat(3,minmax(0,1fr))}
.homecols .opt{padding:9px 11px}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .seg button{flex-direction:row;justify-content:center;gap:8px;padding:5px 6px}
.llist{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:24px 200px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:8px 12px}
.lrow .meta{text-align:right}
.crow2{display:grid;grid-template-columns:110px minmax(0,1fr) 230px;gap:14px;align-items:center;padding:8px 12px}
.crow2 .s{font-size:.84rem;line-height:1.35}
.crow2 .vals{display:flex;flex-direction:column;gap:3px}
.crow2 .chip{font-size:.72rem;padding:1px 7px}
.go.armed{background:var(--bad)}
.setup.company{max-width:1100px;margin-top:0;gap:14px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:120px minmax(0,1fr) 150px;gap:12px;align-items:center}
.mrow .meta{text-align:right;white-space:nowrap}
.mrow>span:first-child{display:flex;flex-direction:column}
.budget{background:var(--accent-soft);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.budget b{font-family:var(--f-data);font-size:1.5rem}
.rules ol{gap:3px}
@media (max-width:900px){.crow,.lrow,.crow2,.mrow{grid-template-columns:minmax(0,1fr)}.lrow .meta,.mrow .meta{text-align:left}}
.tabbody>*{flex-shrink:0}
.fit{display:flex;flex-direction:column;gap:12px;min-width:0}
.top .kpis{gap:14px}
.top .btns{align-items:center}
@media (min-width:901px) and (max-width:1150px){
  .work{grid-template-columns:minmax(0,1fr) 210px}
  .tabs button{padding:6px 6px;font-size:.8rem;gap:4px}
}
@media (min-width:901px) and (max-height:760px){
  #app.wrap{padding-block:6px;gap:6px}
  .app{gap:6px}
  .top{padding-block:0 6px}
  .brand h1{font-size:1.15rem}
  .kpi .label{font-size:.65rem}
  .kpi b{font-size:.92rem}
  .tabpanel{padding:10px 14px;gap:8px}
  .tabs button{padding:6px 8px;font-size:.84rem}
  .tabbody h2{font-size:1.05rem}
  .tabnav{padding-top:8px}
  .tabnav .go.small,.tabnav .ghost{padding:6px 12px;font-size:.88rem}
  .side .card{padding:12px;gap:6px}
  .side .r{font-size:.84rem}
  .side .go{padding:10px 14px;font-size:.95rem}
  .side h3{font-size:.95rem}
  .crow .seg button{padding:4px 6px}
  .opt{padding:7px 10px}
  .tbar{padding:6px 12px}
}
.tabbody>.fit{gap:12px}
.main>.fit{flex:1;min-height:0;display:flex;flex-direction:column}
.side>.fit{display:block}
@media (min-width:901px){.main.fitbox>.fit{height:100%}}
.tabbody .msgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tabbody .msgs li{padding:7px 10px;font-size:.88rem}
.homecols .panel{padding:16px;gap:10px}
.homecols .form{gap:10px}
.setup.wide{gap:14px}
.comps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}
.comps .comp{grid-template-columns:120px minmax(0,1fr);border-top:0;padding-block:4px}
.seg button{padding:6px 4px}
.side .card{gap:8px}
.sent-screen{gap:14px}
.sent-msg{background:var(--good-soft);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.sent-msg h2{color:var(--good)}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sitem{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sitem b{font-size:.95rem;overflow-wrap:anywhere}
.homecols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.homecols .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.setup.wide{max-width:1100px;margin-top:0}
.setup.wide .hero h1{font-size:2rem}
.cursos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.winner{background:var(--good-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column}
.winner b{font-size:1.15rem;color:var(--good)}
.podium{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.podium li{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
@media (min-width:901px){
  html,body{height:100%}
  #app.wrap{height:100%;padding-block:10px;gap:10px;max-width:1320px;overflow:hidden}
  .app{flex:1}
  .main{flex:1}
  .work{flex:1}
  .work>.tabpanel{min-height:0}
  .tabbody{flex:1;min-height:0;overflow:auto}
  .side{position:static;overflow:auto;min-height:0}
  .tabpanel .tabbody{overflow:auto}
  #app.wrap:has(.setup),#app.wrap:has(.splash){overflow:auto}
}
@media (max-width:900px){
  .grid2,.grid3,.grid4,.grid5,.comps,.homecols{grid-template-columns:minmax(0,1fr)}
  .grid4,.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .work{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.grid4,.grid5{grid-template-columns:minmax(0,1fr)}}
.small-drop{width:120px;height:120px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.9rem;margin:0}
.team-logo{height:40px;width:auto;max-width:90px;object-fit:contain;align-self:center}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:24px}
.splash-logo{max-height:180px;max-width:min(320px,80%);object-fit:contain}
.splash-curso{font-family:var(--f-data);font-weight:600;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.splash-centro{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;max-width:18ch}
.splash-go{width:auto;min-width:220px;padding:18px 36px;font-size:1.3rem;margin-top:8px}
.schoolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:32px}
.schoolbar .logo{height:32px;width:auto;max-width:120px;object-fit:contain}
.schoolbar .school{font-weight:700;color:var(--muted);font-size:.9rem;min-width:0}
.schoolbar .sp{flex:1}

/* ================= Movimiento =================
   Animaciones con transform/opacity (baratas en tabletas y Chromebooks del aula).
   Con «reducir movimiento» activado en el dispositivo, todo aparece directamente. */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.34,1.56,.64,1)}
button{transition:transform .18s var(--ease-out),background-color .2s,color .2s,border-color .25s,box-shadow .25s,opacity .2s}
button:not(:disabled):active{transform:scale(.97)}
.go:not(:disabled):hover{box-shadow:0 8px 22px -10px var(--accent)}
.stat,.card,.sitem{transition:transform .25s var(--ease-out),box-shadow .25s}
@media (hover:hover){.stats5 .stat:hover{transform:translateY(-2px);box-shadow:0 8px 20px -14px rgba(20,27,43,.45)}}

@keyframes fx-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fx-rise-s{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fx-blur{from{opacity:0;filter:blur(10px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes fx-fade{from{opacity:0}to{opacity:1}}
@keyframes fx-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fx-pop-s{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fx-bar{from{transform:scaleX(0)}to{transform:none}}
@keyframes fx-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
@keyframes fx-odo{from{transform:translateY(0)}to{transform:translateY(calc(var(--n) * -1.15em))}}
@keyframes fx-glow{0%{text-shadow:0 0 0 transparent}45%{text-shadow:0 0 16px currentColor}100%{text-shadow:0 0 0 transparent}}
@keyframes fx-tick{0%{transform:none}30%{transform:scale(1.12)}100%{transform:none}}
@keyframes fx-drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
@keyframes fx-shine{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}

.sd-bar i{transform-origin:left center}
[dir="rtl"] .sd-bar i{transform-origin:right center}
.fx-pt{transform-box:fill-box;transform-origin:center}
.fx-amt{display:inline-block;white-space:nowrap}
.odo{display:inline-block;height:1.15em;line-height:1.15em;overflow:hidden;vertical-align:bottom}
.odo-s{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.odo-s>span{height:1.15em}

/* Pantalla de inicio: fondo con luz suave y botón con brillo */
.splash{position:relative;isolation:isolate;overflow:clip}
.splash::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 42% at 32% 40%,var(--accent-soft),transparent 70%),radial-gradient(32% 36% at 70% 64%,rgba(194,65,12,.13),transparent 70%);
  animation:fx-drift 14s ease-in-out infinite alternate}
.splash-go{position:relative;overflow:hidden}
.splash-go::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);animation:fx-shine 4.5s 3.5s ease-in-out infinite}

/* Decisiones enviadas: icono de confirmación */
.sent-msg{flex-direction:row;align-items:center;gap:14px}
.fx-check{width:46px;height:46px;flex:none}
.fx-check circle{fill:none;stroke:var(--good);stroke-width:3}
.fx-check path{fill:none;stroke:var(--good);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}

/* Glosario */
.gloss-ov{animation:fx-fade .22s ease-out both}
.gloss-box{animation:fx-pop-s .38s var(--ease-out) both}

/* Confeti del resumen final */
.fx-confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}

.fxi-glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;left:50%;top:50%;margin:-35vmax 0 0 -35vmax;
  background:radial-gradient(closest-side,var(--accent-soft),transparent);opacity:0;animation:fx-fade 1.2s .1s ease-out both,fx-drift 6s ease-in-out infinite alternate}

.fxi-body{fill:none;stroke:var(--ink);stroke-width:3;animation:fx-draw .9s .1s cubic-bezier(.65,0,.35,1) both}
.fxi-notch{stroke:var(--ink);stroke-width:3;stroke-linecap:round;animation:fx-draw .3s .85s ease-out both}
.fxi-screen{fill:var(--accent);opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:fxi-screen .7s 1.4s var(--ease-out) both}
@keyframes fxi-screen{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
.fxi-slot{position:relative;height:1.25em;width:min(92vw,900px);font-size:clamp(2.2rem,8.5vw,4.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.fxi-words>span,.fxi-title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.fxi-words>span{opacity:0;animation:fxi-word .62s cubic-bezier(.3,.7,.2,1) both}
.fxi-words>span:last-child{color:var(--accent)}
@keyframes fxi-word{0%{opacity:0;filter:blur(10px);transform:translateY(.35em)}28%,72%{opacity:1;filter:blur(0);transform:none}100%{opacity:0;filter:blur(10px);transform:translateY(-.35em)}}
.fxi-title>span{display:inline-block;animation:fxi-letter .7s var(--ease-out) both}
.fxi-title>span.a{color:var(--accent)}
@keyframes fxi-letter{from{opacity:0;filter:blur(8px);transform:translateY(.45em)}to{opacity:1;filter:blur(0);transform:none}}
.fxi-sub{margin:0;font-family:var(--f-data);font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);animation:fx-rise .7s 2.5s var(--ease-out) both}

["Subida de precios","Prices go up","ارتفاع الأسعار"],

["Ley europea de reparación","European right-to-repair law","قانون أوروبي لإصلاح الأجهزة"],

/* ================= Modelo económico ================= */
/* Continente donde vendió la empresa la semana anterior (para eventos dirigidos) */
function lastCont(t,w){const h=(t.history||[]).filter(x=>x.week<w&&x.sent).sort((a,b)=>b.week-a.week)[0];return h?h.cont:(t.dec&&t.dec.cont)||'europa'}
function pickEvent(t,s,used){
  const tgt=lastCont(t,s), ok=e=>(!e.model||e.model===t.model)&&(!e.target||tgt!=='europa');
  let pool=EVENTS.filter(e=>ok(e)&&!used.includes(e.id));
  if(!pool.length) pool=EVENTS.filter(e=>ok(e)&&e.id!==used[used.length-1]);
  const e=pool[Math.floor(rnd(G.code+'|ev|'+t.id+'|'+s)*pool.length)];
  return {...e,target:e.target?tgt:null};
}
/* Desde la semana EV_FROM, cada ronda trae un evento nuevo para cada empresa (no se repite en la partida mientras queden) */
function teamEvent(t,w){
  if(!t||w<EV_FROM) return null;
  const used=[]; let e=null;
  for(let s=EV_FROM;s<=w;s++){e=pickEvent(t,s,used);used.push(e.id)}
  return {...e,start:w,end:w,title:e.t(e.target),text:e.d(e.target)};
}
const blockedCont=(ev,c)=>!!(ev&&ev.block&&ev.target===c);
const modeOK=(c,m,ev)=>SHIP[c][m]!==undefined&&!(ev&&ev.blockMode===m);
const period=w=>Math.floor((w-1)/2);
function trend(m,w){const a=Object.keys(ATTR);return a[Math.floor(rnd(G.code+'|tr|'+period(w)+'|'+m)*a.length)]}
function lookFx(t,c){const l=t.design&&t.design.look;return l?{m:LOOKFX[c][l][0],why:LOOKFX[c][l][1],look:l}:{m:1,why:'',look:null}}
function fitOf(dec,w,t){
  const ev=teamEvent(t,w), m=MODELS[dec.model], fav=trend(dec.model,w);
  const cw=CONTS[dec.cont].w, nw=(NICHES[dec.niche]||NICHES.estudiantes).w, cs=Object.values(cw).reduce((a,b)=>a+b,0);
  const wt={}; for(const k in ATTR) wt[k]=0.5*cw[k]/cs+0.5*(nw[k]||0); wt[fav]+=.3;
  if(ev&&ev.boost&&(!ev.boostCont||ev.boostCont===dec.cont)) wt[ev.boost]+=.25;
  const sum=Object.values(wt).reduce((a,b)=>a+b,0); for(const k in wt) wt[k]/=sum;
  let fit=0; const gaps=[];
  for(const k in ATTR){const q=qOf(k,dec.comps[k]);fit+=wt[k]*q;gaps.push({k,g:wt[k]*(1-q),q:dec.comps[k]})}
  const sat=fit>=m.exp?1+0.5*(fit-m.exp):Math.pow(fit/m.exp,2.5);
  gaps.sort((a,b)=>b.g-a.g);
  return {fit,sat,gaps,ev};
}
function costs(dec,w,t){
  const ev=teamEvent(t,w), m=MODELS[dec.model], c=dec.cont, md=dec.mode;
  let unit=m.base; for(const k in ATTR) unit+=cOf(k,dec.comps[k]); for(const k in EXTRAS) if(dec.extras&&dec.extras[k]) unit+=EXTRAS[k].c;
  if(ev&&ev.costMul) unit*=ev.costMul;
  unit+=ecoUnit(dec);
  let ship=(SHIP[c][md]||0)*(ev&&ev.transMul&&ev.transMul[md]||1);
  if(md==='barco'&&ev&&ev.shipCont&&ev.shipCont[c]) ship*=ev.shipCont[c];
  let onTime=ONTIME[c][md]||0; if(md==='barco'&&ev&&ev.delayCont&&ev.delayCont[c]) onTime-=ev.delayCont[c];
  const tariff=ev&&ev.tariff&&ev.target===c?ev.tariff:0;
  if(isAdv(t)){
    const A=advCalc(dec,w,t), Z=A.Z; unit+=AIF[+A.a.ai||0].c*(ev&&ev.costMul||1);
    if(md==='barco'&&Z.ship) ship*=Z.ship; if(md==='avion'&&Z.air) ship*=Z.air;
    const per=unit+ship+Z.v;
    return {unit,ship,zoneV:Z.v,per,onTime,tariff:A.f.tax?Math.max(tariff,TARIFF_BASE[c]||0):tariff,iva:A.f.tax&&c==='europa'?IVA:0,A,invest:Math.min(dec.prod,A.cap)*per+A.fixedTot};

function simulateAdv(dec,w,t){

  if(X.broke) out.push({c:'bad',t:`Avería en la maquinaria: perdisteis el 40 % de la capacidad y la reparación costó ${eur(REPAIR)}. Con más mantenimiento hay menos averías.`});
  if(d.prod>X.produced) out.push({c:'bad',t:`Queríais fabricar ${int(d.prod)} móviles, pero vuestra fábrica solo pudo hacer ${int(X.produced)}. Contratad más personas, comprad mejor maquinaria o fabricad menos.`});
  const lvl=+A.a.ai||0;
  if(lvl) out.push({c:r.D.aiMul>1.05?'good':r.D.aiMul<1?'bad':'',t:`${AIF[lvl].n} en el móvil: ${r.D.aiMul>=1?'+':''}${Math.round((r.D.aiMul-1)*100)} % de demanda entre ${r.N.n.toLowerCase()}.${lvl===2&&d.comps.cpu===1?' Con un procesador normal, la IA avanzada va lenta y convence poco.':''}`});
  else if(d.model==='C'&&f.ai) out.push({c:'bad',t:'Los clientes de gama alta esperan funciones de IA: sin ellas vendéis algo menos.'});
  if(f.ads&&A.media.length){const ff=r.D.ff;out.push({c:ff>=1.15?'good':ff<.9?'bad':'',t:`Publicidad (${eur(A.mediaC)}) en ${A.media.map(k=>MEDIA[k].n.toLowerCase()).join(', ')} con enfoque «${FOCUS[A.a.focus].n.toLowerCase()}». ${ff>=1.15?'El enfoque encajó muy bien con vuestro nicho.':ff<.9?'Ese enfoque no convence mucho a vuestro nicho.':'Encaje normal con vuestro nicho.'}`})}
  else if(f.ads) out.push({c:'',t:'No hicisteis publicidad: menos gente conoció vuestro móvil.'});
  if(f.tax) out.push({c:'',t:`Impuestos: IVA cobrado a los clientes y entregado a Hacienda ${eur(X.iva)}${X.tariffPaid?` · aranceles ${eur(X.tariffPaid)}`:''} · impuesto de sociedades ${eur(X.tax.tax)}${X.tax.base?` (${pctS(X.tax.rate)}, ${TAXK[X.tax.kind]})`:''}.`});
  if(f.tax&&X.pbt<0) out.push({c:'',t:`Con pérdidas no se paga impuesto de sociedades. Esas pérdidas (${eur(X.tax.carryNew)} pendientes) se restarán de los beneficios de las próximas semanas.`});
  return out;
}

/* ================= Financiación, sostenibilidad y factura =================
   Préstamo con cuota constante (sistema francés); el interés es un gasto y la devolución del capital solo mueve caja.
   Descubierto: si la caja queda en negativo, el banco cobra un 0,5 % semanal. Valores orientativos del juego. */
const LOAN_OPTS=[0,10000,25000,50000], LOAN_TERMS=[4,8], LOAN_TIN=.09, RESCUE_TIN=.15, OVERDRAFT_W=.005, BANKRUPT=-30000;
const PLAZOS={no:{n:'Sin pago a plazos',d:'Los clientes pagan el móvil entero al comprarlo.'},
  propia:{n:'Plazos sin intereses que financiáis vosotros',d:'Atrae a muchos más clientes, pero una parte no termina de pagar (impagos: se pierde un 8 % de esas ventas).'},
  financiera:{n:'Plazos con una financiera',d:'El cliente paga intereses a la financiera (TAE 15 %). Atrae algo menos, la financiera asume los impagos y os cobra un 2 % de comisión.'}};
const ECO={reciclado:{n:'Embalaje reciclado y sin plástico',d:'Caja de cartón reciclado, sin plásticos de un solo uso.',c:1,rep:.5},
  recogida:{n:'Recogida y reciclaje del móvil viejo',d:'Recogéis el móvil antiguo del cliente y lo lleváis a reciclar.',c:3,rep:1},
  co2:{n:'Compensar el CO₂ del transporte',d:'Pagáis proyectos que absorben el CO₂ que emite el transporte (unos 40 € por tonelada).',c:0,rep:.5}};
const DIST={europa:2000,america:8000,asia:10000,africa:5000,oceania:17000}, EF={camion:.1,barco:.015,avion:.6};
/* Gramos de CO₂ por móvil (0,4 kg con caja) según distancia y medio: valores orientativos */
const co2g=(c,m)=>Math.round(0.0004*(DIST[c]||5000)*(EF[m]||.1)*1000);
const ecoOf=d=>({reciclado:false,recogida:false,co2:false,...(d.eco||{})});
function ecoUnit(d){const e=ecoOf(d);return (e.reciclado?ECO.reciclado.c:0)+(e.recogida?ECO.recogida.c:0)+(e.co2?co2g(d.cont,d.mode)/1000*0.04:0)}
function ecoFx(d){const e=ecoOf(d), eu=d.cont==='europa', fam=d.niche==='mayores'||d.niche==='familias';let m=1,rep=0;
  if(e.reciclado){m*=eu?1.03:1.01;rep+=.5} if(e.recogida){m*=fam?1.04:eu?1.02:1.01;rep+=1} if(e.co2){m*=eu?1.03:1.01;rep+=.5}
  return {m,rep,on:Object.keys(ECO).filter(k=>e[k])}}
function finPrev(t,w){const h=((t&&t.history)||[]).filter(x=>x.week<w&&x.fin).sort((a,b)=>b.week-a.week)[0];return h?{balance:h.fin.balance||0,cuota:h.fin.cuota||0,left:h.fin.left||0,i:h.fin.i||0}:{balance:0,cuota:0,left:0,i:0}}
const cuotaOf=(P,i,n)=>P*i/(1-Math.pow(1+i,-n));
function finCalc(dec,w,t){
  const f={loan:0,term:8,plazos:'no',...(dec.fin||{})}, P=finPrev(t,w), cash=t?t.cash:START_CASH;
  let interest=0, principal=0, bal=P.balance, left=P.left, cuota=P.cuota, i=P.i, taken=0, tin=0;
  if(bal>0&&left>0){interest=bal*i;principal=Math.min(bal,cuota-interest);bal-=principal;left--;if(left<=0){principal+=bal;bal=0}}
  const active=bal>0.5;
  if(!active&&LOAN_OPTS.includes(+f.loan)&&+f.loan>0){tin=cash<0?RESCUE_TIN:LOAN_TIN;i=tin/52;const n=LOAN_TERMS.includes(+f.term)?+f.term:8;taken=+f.loan;cuota=cuotaOf(taken,i,n);bal=taken;left=n}
  const over=cash<0?-cash*OVERDRAFT_W:0;
  return {taken,tin,interest,principal,over,active,pay:interest+principal,state:{balance:Math.round(bal*100)/100,cuota:Math.round(cuota*100)/100,left,i},plazos:PLAZOS[f.plazos]?f.plazos:'no',f,P};
}
function plazosFx(dec){const k=(dec.fin&&dec.fin.plazos)||'no', N=NICHES[dec.niche]||NICHES.estudiantes, e=N.el>=.3?.15:N.el>=0?.08:.03;
  return k==='propia'?{m:1+e,loss:.4*.08,k}:k==='financiera'?{m:1+e*.6,loss:.4*.02,k}:{m:1,loss:0,k}}
const INV_CLIENTS=['Electrónica Montefrío S.L.','Telefonía Loja S.L.','Móviles Alcalá S.L.','Tecnosierra Íllora S.L.','Digital Priego S.L.','Comunicaciones Algarinejo S.L.'];
const r2=x=>Math.round(x*100)/100;
function invOrder(t,w){
  const a=rnd(G.code+'|inv|'+t.id+'|'+w), b=rnd(G.code+'|invq|'+t.id+'|'+w), adv=isAdv(t);

  return {client:INV_CLIENTS[Math.floor(a*INV_CLIENTS.length)],qty,price,imp,disc,base,iva,total,adv,num:'F-2026-'+String(w).padStart(2,'0')+'-'+String(Math.floor(a*900)+100)};
}

  const g=h.profit>0?T('Habéis ganado {0} y vendido {1} móviles.',eur(h.profit),int(h.sold)):good?good.t:null;

}

function niceStep(range){const raw=range/4, p=Math.pow(10,Math.floor(Math.log10(raw||1))), m=raw/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function chartSVG(S,small){

  const vals=S.flatMap(s=>s.pts.map(p=>p.v));
  let lo=Math.min(0,...vals), hi=Math.max(0,...vals); if(hi===lo) hi=lo+1;

}

let TFLASH='', RVIEW='general', RMETRIC='profit', ALLT=null, ALLT_BUSY=false;
const DAY_OPTS=[[1,'1 día'],[2,'2 días'],[3,'3 días'],[7,'1 semana'],[14,'2 semanas']];
const rulesTxt=r=>{r={...RULE_DEF,...(r||{})};return `${LEVELS[r.level]||'Básico'} · ${r.rounds} rondas · `+(r.roundMs?`cada ${(DAY_OPTS.find(o=>o[0]===Math.round(r.roundMs/864e5))||[0,Math.round(r.roundMs/864e5)+' días'])[1]}${r.endTime?' a las '+r.endTime:''}`:'publicación manual')};
/* Campos de reglas (los usan «Crear curso» y «Cursos») */
function rulesFields(p,r,minR,lock,bare){
  r={...RULE_DEF,...(r||{})}; const manual=!r.roundMs, days=r.roundMs?Math.round(r.roundMs/864e5):1, tm=r.endTime||'09:00';
  return `<div class="rules-grid">
    <label for="${p}-level"><b>Dificultad</b><span class="lv-row"><select id="${p}-level" ${lock?'disabled':''}>${Object.entries(LEVELS).map(([k,n])=>`<option value="${k}" ${(r.level||'basico')===k?'selected':''}>${n}</option>`).join('')}</select>${p==='n'?`<button type="button" class="ghost eye" id="n-eye" title="Ver y elegir apartados" aria-label="Ver y elegir apartados">${EYE}<span>${secCount(r.level||'basico',NEWOFF)}</span></button>`:''}</span></label>
    <label for="${p}-rounds"><b>Duración de la partida</b><select id="${p}-rounds">${[3,4,5,6,7,8,9,10].map(n=>`<option value="${n}" ${n===r.rounds?'selected':''} ${n<(minR||3)?'disabled':''}>${n} rondas</option>`).join('')}</select></label>
    <label for="${p}-days"><b>Cada cuánto cambia de ronda</b><select id="${p}-days" ${manual?'disabled':''}>${DAY_OPTS.map(([v,l])=>`<option value="${v}" ${v===days?'selected':''}>${l}</option>`).join('')}</select></label>
    <label for="${p}-time"><b>Hora de cierre y publicación</b><input type="time" id="${p}-time" value="${esc(tm)}" ${manual?'disabled':''}></label>
  </div>
  <label class="check" for="${p}-manual"><input type="checkbox" id="${p}-manual" ${manual?'checked':''}> Publicar los resultados manualmente</label>
  ${bare?'':`<p class="hint" id="${p}-lvhint">${LEVEL_HINT}${lock?' La dificultad ya no se puede cambiar porque hay resultados publicados.':''}</p>
  <p class="hint" id="${p}-prev"></p>`}`;
}
const LEVEL_HINT='Básico: diseño, componentes, mercado, transporte, publicidad (cuánto invertir), precio, financiación y factura. Progresivo: empieza como el básico, sin financiación ni factura; en publicidad eligen los medios, y añade bloques del avanzado (semana 2 plantilla y maquinaria, semana 3 ubicación de la fábrica). No incluye mejoras con IA ni impuestos. En publicidad: básico, solo cuánto invertir; progresivo, en qué medios; avanzado, medios y enfoque del anuncio. Avanzado: añade plantilla y sueldos (con huelgas y automatización con IA), maquinaria y averías, IA en el móvil, ubicación de la fábrica en Andalucía con costes fijos y variables, IVA, aranceles e impuesto de sociedades, y publicidad por enfoque y medios. Las secciones aparecen en un menú lateral (☰).';
function readRules(p){
  const manual=document.getElementById(p+'-manual').checked;
  const lv=document.getElementById(p+'-level');
  const lvl=lv?lv.value:'basico', off=p==='n'?NEWOFF.filter(k=>secsOfLevel(lvl).some(([x])=>x===k)):document.querySelector(`input[data-sec="${p}"]`)?readOff(p,lvl):undefined;
  const r={rounds:+document.getElementById(p+'-rounds').value,roundMs:manual?0:(+document.getElementById(p+'-days').value)*864e5,level:lvl};
  if(off) r.off=off;
  if(p==='n') r.unlock={...NEWUNLOCK}; else if(document.querySelector(`select[data-unl="${p}"]`)) r.unlock=readUnlock(p);
  if(!manual) r.endTime=document.getElementById(p+'-time').value||'09:00';
  return r;
}
function bindRulesFields(p,g){
  const m=document.getElementById(p+'-manual'); if(!m) return;
  const upd=()=>{
    const man=m.checked; document.getElementById(p+'-days').disabled=man; document.getElementById(p+'-time').disabled=man;
    const r=readRules(p), wk=g?Math.min(g.week,r.rounds):1, d=dueAt({openedAt:g?g.openedAt:Date.now(),rules:r}), pv=document.getElementById(p+'-prev'); if(!pv) return;
    pv.textContent=man?'Los resultados solo se publicarán cuando pulses «Publicar resultados» en la pestaña «Cursos».'
      :`${d<=Date.now()?'Con este cambio la ronda vuelve a contar desde ahora. ':''}La ronda ${wk} terminará el ${fmtDate(d<=Date.now()?dueAt({openedAt:Date.now(),rules:r}):d)} y los resultados se publicarán solos. Hace falta que algún dispositivo tenga la app abierta a esa hora; si no, se publican en cuanto alguien la abra.`;
  };
  [p+'-manual',p+'-days',p+'-time',p+'-rounds'].forEach(id=>{const e=document.getElementById(id);e&&e.addEventListener('input',upd);e&&e.addEventListener('change',upd)});
  upd();
}

/* 5. Resultados con gráficas de líneas */
function lineChart(S,o){
  const W=640,H=o.h||280,L=70,R=16,TP=14,B=34, minW=o.minW||0, maxW=Math.max(minW+1,o.maxW||1);
  const vals=S.flatMap(s=>s.pts.map(p=>p.v)); if(!vals.length) return `<div class="empty">${o.empty||'Todavía no hay resultados publicados.'}</div>`;
  let lo=Math.min(0,...vals), hi=Math.max(0,...vals); if(hi===lo) hi=lo+1;
  const st=niceStep(hi-lo); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const x=w=>L+(W-L-R)*(w-minW)/(maxW-minW), y=v=>TP+(H-TP-B)*(1-(v-lo)/(hi-lo)), f=o.fmt||(v=>int(v));
  let grid='';
  for(let v=lo;v<=hi+1e-9;v+=st) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}"></line><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${compact(v)}${o.money?' €':''}</text>`;
  for(let w=minW;w<=maxW;w++) grid+=`<text x="${x(w)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${w===0?'Inicio':'S'+w}</text>`;
  const lines=S.map((s,si)=>{if(!s.pts.length)return '';const d=s.pts.map((p,i)=>(i?'L':'M')+x(p.w).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
    return `<path class="fx-ln" data-i="${si}" pathLength="1" d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.bold?4:2.5}" stroke-linejoin="round" stroke-linecap="round"></path>
      ${s.pts.map(p=>`<circle class="fx-pt" data-i="${si}" data-p="${((p.w-minW)/(maxW-minW)).toFixed(3)}" cx="${x(p.w)}" cy="${y(p.v)}" r="${s.bold?4.5:3.5}" fill="${s.color}"><title>${esc(s.name)} · ${p.w===0?'Inicio':'S'+p.w}: ${f(p.v)}</title></circle>`).join('')}`}).join('');
  return `<svg data-fx-chart="${esc(o.key)}|${S.length}|${maxW}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'Gráfica')}">${grid}${lines}</svg>`;
}

/* Propuestas de recomendación a partir de la última semana del grupo (el profesor/a las edita) */
function fbSuggest(t){
  const H=(t.history||[]).slice().sort((a,b)=>a.week-b.week), h=H[H.length-1], p=H[H.length-2], out=[];
  if(!h) return out;
  if(!h.sent) out.push('La semana pasada no enviasteis decisiones. Repasad todas las pestañas y enviadlas a tiempo.');
  else{
    if(h.demand>h.prod*1.1) out.push('Faltaron móviles: había más gente que quería comprar de los que fabricasteis. Probad a fabricar más o a subir un poco el precio.');
    if(h.prod>h.demand*1.1) out.push('Sobraron móviles. Fabricad menos, bajad un poco el precio o invertid algo más en publicidad.');
    if(h.profit<0) out.push('Habéis tenido pérdidas. Comparad lo que os cuesta fabricar cada móvil con el precio al que lo vendéis.');
    if(h.ad===0) out.push('No habéis invertido en publicidad. Probad con una cantidad pequeña y comparad cuántos clientes nuevos llegan.');
    if(p&&h.profit>p.profit) out.push('Buen trabajo: habéis ganado más que la semana anterior. ¿Qué decisión creéis que ha marcado la diferencia?');
    if(p&&h.profit<p.profit&&h.profit>=0) out.push('Habéis ganado menos que la semana anterior. Comparad qué cambiasteis entre una semana y otra.');
  }
  return out.slice(0,4);
}

const FB_ROOT='mercado-movil/v1/';

/* Traduce la interfaz que usa Store (doc, collection, onSnapshot, acquire) a Firestore */
function fireDB(fs){
  const snap=s=>({exists:s.exists,data:()=>s.data()});
  const wrapQ=q=>({docs:q.docs.map(d=>({data:()=>d.data()}))});
  return {
    doc(p){const r=fs.doc(FB_ROOT+p);return {
      get:()=>r.get().then(snap), set:v=>r.set(v), update:v=>r.update(v), delete:()=>r.delete(),
      onSnapshot:(cb,err)=>r.onSnapshot(s=>cb(snap(s)),err),
      /* Cerrojo para que solo un dispositivo calcule el cierre de semana */
      acquire:async({holder,ttlMs})=>{const L=fs.doc(FB_ROOT+'bloqueos/'+p.replace(/\//g,'_'));
        try{return await fs.runTransaction(async tx=>{const d=await tx.get(L),v=d.exists?d.data():null,now=Date.now();
          if(v&&v.holder!==holder&&v.until>now) return {acquired:false};
          tx.set(L,{holder,until:now+ttlMs}); return {acquired:true}})}catch(e){return {acquired:false}}}
    }},
    collection(p){const r=fs.collection(FB_ROOT+p);return {get:()=>r.get().then(wrapQ),onSnapshot:(cb,err)=>r.onSnapshot(q=>cb(wrapQ(q)),err)}}
  };
}

/* ================= Movimiento: intro, entradas de pantalla y revelado de resultados =================
   Cada animación se reproduce una sola vez por clave (pantalla, semana, gráfica), aunque la app
   vuelva a pintar la pantalla al recibir datos. Con «reducir movimiento» no se anima nada. */
const FX=(()=>{
  const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
  const now=()=>performance.now();
  const seen=new Set(), mem={};
  let lastKey='', introEnd=0;
  const base=()=>Math.max(0,introEnd-now());
  const once=k=>seen.has(k)?false:(seen.add(k),true);
  function play(el,name,dur,delay=0,ease='var(--ease-out)',keep=false){
    if(!el||!el.style) return;
    el.style.animation=`${name} ${dur}ms ${ease} ${Math.round(delay)}ms both`;
    if(keep) return;
    const h=e=>{if(e.target!==el)return;el.style.animation='';el.removeEventListener('animationend',h)};
    el.addEventListener('animationend',h);
  }
  const stagger=(els,name,dur,start,step,max=10)=>[...els].forEach((el,i)=>play(el,name,dur,start+Math.min(i,max)*step));
  const FMT={eur:v=>eur(v),int:v=>int(v),plus:v=>'+'+int(v)};
  /* Contador: cambia solo el texto (sin crear nodos) para no disparar el reajuste de pantalla en cada fotograma */
  function count(el,delay,dur=1100,from=0){
    if(!el) return; const to=parseFloat(el.dataset.n), f=FMT[el.dataset.f]||FMT.int; if(!isFinite(to)) return;
    const final=el.textContent; el.textContent=f(from); const tn=el.firstChild, t0=now()+delay;
    const step=t=>{if(!el.isConnected||tn.parentNode!==el)return;
      const p=Math.min(1,Math.max(0,(t-t0)/dur)), e=1-Math.pow(1-p,4);
      tn.data=p>=1?final:f(from+(to-from)*e); if(p<1) requestAnimationFrame(step)};
    requestAnimationFrame(step);
  }
  /* Cifras que ruedan como un cuentakilómetros */
  function odo(el,delay,dur=1400){

    if(LANG==='ar'||!/\d/.test(final)) return count(el,delay,dur);
    el.setAttribute('aria-label',final);
    const strip='01234567890123456789'.split('').map(d=>`<span>${d}</span>`).join('');
    el.innerHTML=[...final].map(c=>/\d/.test(c)?`<span class="odo" aria-hidden="true"><span class="odo-s" style="--n:${10+ +c}">${strip}</span></span>`:`<span aria-hidden="true">${esc(c)}</span>`).join('');
    const S=el.querySelectorAll('.odo-s');

    setTimeout(()=>{if(el.isConnected){el.textContent=final;el.removeAttribute('aria-label')}},delay+dur+S.length*70+80);
  }
  function confetti(){
    if(RM()) return;
    const c=document.createElement('canvas'); c.className='fx-confetti'; document.body.appendChild(c);
    const dpr=Math.min(2,window.devicePixelRatio||1), W=innerWidth, H=innerHeight; c.width=W*dpr; c.height=H*dpr;
    const x=c.getContext('2d'); x.scale(dpr,dpr);

    const cols=['--c1','--c2','--c3','--c4','--c6','--c7'].map(v=>cs.getPropertyValue(v).trim()||'#2448B5');
    const P=Array.from({length:150},(_,i)=>{const s=i%2;return {x:s?W*.88:W*.12,y:H*.42,vx:(s?-1:1)*(2+Math.random()*8),vy:-(7+Math.random()*10),w:6+Math.random()*6,h:8+Math.random()*9,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]}});
    const t0=now(), L=2800;
    (function f(t){const e=t-t0; x.clearRect(0,0,W,H);
      for(const p of P){p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);

function fitAll(){
  labelTables();

  const anims=(document.getAnimations?document.getAnimations():[]).filter(a=>a.playState!=='finished'&&a.effect&&a.effect.target&&app.contains(a.effect.target));
  const saved=anims.map(a=>{const t=a.currentTime;try{const e=a.effect.getComputedTiming().endTime;if(isFinite(e))a.currentTime=e}catch(e){}return t});
  document.querySelectorAll('.fitbox').forEach(box=>{
    const f=box.querySelector(':scope>.fit'); if(!f) return;
    f.style.zoom='';
    if(small){box.classList.remove('clip');return}
    if(box.classList.contains('noshrink')||box.querySelector('.fitbox')) return;
    const tf=box.classList.contains('tfit');
    const fits=()=>box.scrollHeight<=box.clientHeight+1;
    /* En el panel, un sobrante de pocos píxeles (redondeo del zoom) se recorta en vez de mostrar barra */
    const clip=()=>tf&&box.classList.toggle('clip',box.scrollHeight-box.clientHeight<=12);
    if(fits()){clip();return}
    let lo=+(box.dataset.minz||.72), hi=1;
    for(let i=0;i<7;i++){const z=(lo+hi)/2; f.style.zoom=String(z); if(fits()) lo=z; else hi=z}
    f.style.zoom=String(lo);
    clip();
  });
  anims.forEach((a,i)=>{try{a.currentTime=saved[i]}catch(e){}});
  try{FX.scan()}catch(e){console.error(e)}
  syncLock();
}
